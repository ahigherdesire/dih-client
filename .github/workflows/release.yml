# Builds the mod on every push to beta. When the push brings a mod-version with no release yet
# (gradle/libs.versions.toml), it publishes the jar as release v<version>, creating the tag, with
# the notes from .github/release-notes/<version>.md. A pushed v* tag publishes that tag the same way.
# Versions with a hyphen (5.1-beta.2) become pre-releases, which the in-game update checker ignores.
name: Release

on:
  push:
    branches: [beta]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build -Prelease --console=plain 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          # One annotation with the compiler errors, readable without the full log.
          errors=$(grep -E -A3 "error:|What went wrong|FAILED|Test.*>.*FAILED" build.log | head -120 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Build failed::$errors"

      - name: Collect the jar
        id: jar
        run: |
          version=$(sed -n 's/^mod-version = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          mc=$(sed -n 's/^minecraft = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          name="DIH-Client-$version-$mc.jar"
          cp "build/libs/DIH Client-$version-$mc.jar" "$name"
          sha=$(sha256sum "$name" | cut -d' ' -f1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "$name  $(stat -c %s "$name") bytes  sha256 $sha" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.jar.outputs.name }}
          path: ${{ steps.jar.outputs.name }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.jar.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="v$VERSION"; fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            exit 0
          fi
          flags=""
          case "$tag" in *-*) flags="--prerelease --latest=false" ;; esac
          notes_file=".github/release-notes/${tag#v}.md"
          if [ -f "$notes_file" ]; then cp "$notes_file" notes.md; else echo "DIH Client ${tag#v}" > notes.md; fi
          printf '\nSHA-256: `%s`\n' "${{ steps.jar.outputs.sha }}" >> notes.md
          gh release create "$tag" "${{ steps.jar.outputs.name }}" --target "$GITHUB_SHA" \
            --title "DIH Client ${tag#v}" --notes-file notes.md $flags
